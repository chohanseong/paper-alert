name: Paper Alert

on:
  schedule:
    # 매일 오전 9시 KST(UTC+9) = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      skip_dedup:
        description: "체크하면 이미 발송한 논문도 중복 제외 없이 다시 검색/발송 (테스트용, 발송 이력 파일은 갱신하지 않음)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paper-alert
  cancel-in-progress: false

jobs:
  run-paper-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper alert script
        env:
          MAIL_SENDER: ${{ secrets.MAIL_SENDER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_RECEIVER: ${{ secrets.MAIL_RECEIVER }}
          # 선택 사항: 없으면 AI 초록 요약 없이 기존처럼 동작
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # schedule(cron) 실행에는 workflow_dispatch의 inputs 자체가 존재하지 않으므로
          # github.event.inputs.skip_dedup은 빈 값으로 평가되어 항상 SKIP_DEDUP=false와
          # 동일하게 동작한다 (파이썬 쪽에서 "true"만 참으로 취급).
          SKIP_DEDUP: ${{ github.event.inputs.skip_dedup }}
        run: python paper_alert.py

      - name: Commit and push updated send history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_history.json
          if git diff --cached --quiet; then
            echo "발송 이력에 변경 사항이 없습니다. 커밋을 건너뜁니다."
          else
            git commit -m "chore: update sent_history.json [skip ci]"
            git push
          fi
